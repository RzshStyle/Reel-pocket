name: Deploy the online game library (Cloudflare)

# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# LIBRARY_PASSCODE (the family passcode the app asks for). Game files are uploaded
# in the Cloudflare dashboard, never through this repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [workers/library/**, .github/workflows/library.yml]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Cloudflare secrets are not set yet, so the library was not deployed."; fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        name: Create the private bucket (first run only)
        run: npx wrangler r2 bucket create reel-pocket-games || echo "Bucket already exists"
      - if: steps.check.outputs.ready == 'true'
        name: Deploy the library worker
        working-directory: workers/library
        run: set -o pipefail; npx wrangler deploy -c wrangler.toml | tee deploy.log
      - if: steps.check.outputs.ready == 'true'
        name: Set the passcode
        working-directory: workers/library
        run: printf '%s' "${{ secrets.LIBRARY_PASSCODE }}" | npx wrangler secret put PASSCODE -c wrangler.toml
      - if: steps.check.outputs.ready == 'true'
        name: Show the library address
        working-directory: workers/library
        run: |
          url=$(grep -o 'https://[^ ]*workers\.dev' deploy.log | head -1)
          echo "Library address: $url"
          echo "### Library address: $url" >> "$GITHUB_STEP_SUMMARY"
